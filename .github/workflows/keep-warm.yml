name: Keep warm

# Render's free tier sleeps after 15 idle minutes; a ping every 10 keeps the
# demo responsive. Doubles as uptime monitoring: a failed run means the
# service is down and GitHub sends an email.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 https://dodi-web.onrender.com/api/health
